<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}input,select,textarea{font-size:16px!important}@media (pointer:coarse){button:not(.bed):not(.qg button){min-height:40px}}</style><script src="../shim.js"></script></head><body>
<title>Sewing Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito+Sans:wght@400;600;700&family=Spline+Sans+Mono:wght@500&display=swap">
<style>
/* Layout: a cutting table. Measurements on the left, the paper pattern laid out at scale on the right. */
:root{
  --bg:#e6efee; --panel:#fafcfb; --fg:#16302f; --muted:#4e6665; --line:#bfd2d0; --accent:#0e6b6b; --on-accent:#fff; --pin:#c0392b; --paper:#fffef8; --warn:#7a4a00; --warn-bg:#fbeed0; --cut:#16302f;
  --head:"Cormorant Garamond",Georgia,serif; --body:"Nunito Sans",ui-sans-serif,system-ui,sans-serif; --mono:"Spline Sans Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101b1b;--panel:#172423;--fg:#e4efed;--muted:#a0b5b3;--line:#2f4342;--accent:#6fd0c8;--on-accent:#0c1c1b;--pin:#f08a7c;--paper:#1f2e2d;--warn:#f4cd8a;--warn-bg:#3a2c12;--cut:#e4efed;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101b1b;--panel:#172423;--fg:#e4efed;--muted:#a0b5b3;--line:#2f4342;--accent:#6fd0c8;--on-accent:#0c1c1b;--pin:#f08a7c;--paper:#1f2e2d;--warn:#f4cd8a;--warn-bg:#3a2c12;--cut:#e4efed;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--body)}
.wrap{max-width:1120px;margin:0 auto;padding-block:30px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
h1{font:700 clamp(36px,7vw,54px)/1 var(--head);margin:0}
h2{font:700 25px/1.1 var(--head);margin:0 0 10px}
header p{margin:4px 0 0;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:18px;margin-top:10px}
.tabs button{font:700 15px var(--body);background:none;border:0;border-bottom:3px solid transparent;color:var(--fg);padding:6px 2px;cursor:pointer}
.tabs button[aria-selected="true"]{border-bottom-color:var(--pin);color:var(--accent)}
.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px;align-items:start}
.col{display:grid;gap:16px;min-width:0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:10px;min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px}
label.f{display:grid;gap:3px;font-size:14px;font-weight:600;min-width:0}
input,select{font:400 16px var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:7px 8px;width:100%;min-width:0}
input[type=number]{font-family:var(--mono)}
input[type=color]{height:38px;padding:3px}
input[type=file]{border:0;padding:4px 0;background:none;font-size:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.btn{font:600 14px var(--body);border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:5px;padding:7px 11px;cursor:pointer}
.seg button[aria-pressed="true"],.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.scroll{overflow:auto;max-height:70vh;background:var(--paper);border:1px solid var(--line);border-radius:6px}
svg.sheet{display:block;width:100%;height:auto;min-width:320px}
svg.sheet text{font:600 13px var(--body);fill:var(--fg)}
.total div{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.total span:last-child{font:500 14px var(--mono);text-align:right}
.msg{font-size:14px;color:var(--muted);min-height:1.3em}
.note{font-size:14px;color:var(--muted);max-width:68ch;margin:0}
.warn{font-size:14px;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:9px 11px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td.n{font:500 14px var(--mono)}
.qg{display:grid;gap:0;width:100%;max-width:560px;aspect-ratio:var(--ar,1);border:1px solid var(--line)}
.qg button{padding:0;border:0;border-radius:0;background:none;cursor:pointer;min-width:0;aspect-ratio:1}
.qg svg{display:block;width:100%;height:100%}
.swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.swatches label{display:grid;gap:2px;font-size:13px;width:64px}
.swatches button[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
canvas{max-width:100%;height:auto;display:block;background:var(--paper)}
.key{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 12px;font-size:14px}
.key span.c{display:inline-block;width:16px;height:16px;border:1px solid var(--line);vertical-align:-3px;margin-right:6px}
@media (max-width:840px){.grid{grid-template-columns:minmax(0,1fr)}}
</style>
<div class="wrap">
  <header>
    <h1>Sewing Studio</h1>
    <p>Draft patterns from your measurements, adjust the ones you own, and plan quilts and embroidery.</p>
    <div class="tabs" role="tablist" aria-label="Tools" id="tabs"></div>
  </header>
  <div id="view"></div>
</div>

<script src="../lib/jspdf.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id);
function el(t,p={},...k){const e=document.createElement(t);for(const a in p){if(a==='on'){for(const v in p.on)e.addEventListener(v,p.on[v])}else if(a in e)e[a]=p[a];else e.setAttribute(a,p[a])}e.append(...k.filter(x=>x!=null));return e}
const nf=(v,d)=>{const n=parseFloat(v);return isFinite(n)?n:d};
const fmt=(n,d=1)=>n.toLocaleString('en',{minimumFractionDigits:d,maximumFractionDigits:d});
const CS=100,L=()=>window.ClipperLib;
const toP=p=>p.map(q=>({X:Math.round(q[0]*CS),Y:Math.round(q[1]*CS)})),fromP=p=>p.map(q=>[q.X/CS,q.Y/CS]);
function grow(poly,sa,fold){
  const C=L(),o=new C.ClipperOffset(2,.05*CS),out=[];
  o.AddPath(toP(poly),C.JoinType.jtMiter,C.EndType.etClosedPolygon);o.Execute(out,sa*CS);
  let r=out;
  if(fold){const c=new C.Clipper(),b=[];const big=1e5;c.AddPaths(out,C.PolyType.ptSubject,true);c.AddPath([{X:0,Y:-big},{X:big,Y:-big},{X:big,Y:big},{X:0,Y:big}],C.PolyType.ptClip,true);c.Execute(C.ClipType.ctIntersection,b,C.PolyFillType.pftNonZero,C.PolyFillType.pftNonZero);r=b}
  return fromP(r[0]);
}
const arc=(cx,cy,r,a0,a1,n=40)=>Array.from({length:n+1},(_,i)=>{const a=a0+(a1-a0)*i/n;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]});
const bez=(a,b,c,d,n=24)=>Array.from({length:n+1},(_,i)=>{const t=i/n,u=1-t;return [0,1].map(k=>u*u*u*a[k]+3*u*u*t*b[k]+3*u*t*t*c[k]+t*t*t*d[k])});
const lenOf=p=>p.slice(1).reduce((s,q,i)=>s+Math.hypot(q[0]-p[i][0],q[1]-p[i][1]),0);
const GARMENTS={
  tote:{label:'Tote bag',f:[['bw','Bag width',38],['bh','Bag height',40],['bg','Base depth',10],['sl','Strap length',60],['sw','Strap width',4]],sa:1,
    make(m){return {pieces:[
      {name:'Bag body',cut:'Cut 2',poly:[[0,0],[m.bw+m.bg,0],[m.bw+m.bg,m.bh+m.bg/2],[0,m.bh+m.bg/2]],grain:1},
      {name:'Strap',cut:'Cut 2',poly:[[0,0],[m.sw*2,0],[m.sw*2,m.sl],[0,m.sl]],grain:1}],
      steps:['Sew the sides and bottom of the bag body, right sides together.','Box each base corner: flatten it into a triangle and sew across where it is '+fmt(m.bg,1)+' cm wide.','Fold each strap in half lengthwise, sew, and turn. Stitch it to the top edge, then hem the top.']}}},
  gathered:{label:'Gathered skirt',f:[['hip','Hip',98],['len','Skirt length',60],['full','Fullness',1.6]],sa:1.5,
    make(m){const w=m.hip*m.full/4;return {pieces:[{name:'Skirt panel',cut:'Cut 2 on the fold',fold:true,poly:[[0,0],[w,0],[w,m.len+3],[0,m.len+3]],grain:1}],
      steps:['Sew the two side seams.','Fold the top over to make a 3 cm channel for elastic, and leave a gap.','Thread the elastic through, sew its ends, close the gap, and hem.']}}},
  circle:{label:'Circle skirt',f:[['waist','Waist',76],['len','Skirt length',55]],sa:1.5,
    make(m){const r=(m.waist+2)/(2*Math.PI),o=r+m.len;
      const poly=[...arc(0,0,r,0,Math.PI/2),...arc(0,0,o,Math.PI/2,0)];
      return {pieces:[{name:'Skirt quarter',cut:'Cut 2 on the fold',fold:true,poly,grain:1}],
      steps:['Sew the side seams, leaving 18 cm open at the top of one for a zip.','Add a waistband or facing, and put in the zip.','Hang the skirt for a day before hemming, as the bias edges stretch.']}}},
  top:{label:'Boxy top',f:[['bust','Bust or chest',96],['sh','Shoulder width',42],['len','Top length',62],['sl','Sleeve length',22]],sa:1.5,
    make(m){return tunicDraft(m,1,9,['Sew the shoulders.','Attach the neck binding, stretching it gently.','Sew the sleeves into the armholes, then sew each side and underarm in one seam.','Hem the sleeves and bottom.'])}},
  tunic:{label:'Elven tunic',f:[['bust','Bust or chest',96],['sh','Shoulder width',42],['len','Tunic length',92],['sl','Sleeve length',58],['flare','Sleeve flare',1.5]],sa:1.5,
    make(m){return tunicDraft(m,m.flare,11,['Sew the shoulders, then attach the neck binding.','Sew the sleeves into the armholes.','Sew each underarm and side seam, stopping 25 cm above the hem for side slits.','Press the slit edges under and stitch them, then hem the sleeves and bottom.'])}},
  gown:{label:'Fantasy gown',f:[['bust','Bust or chest',96],['sh','Shoulder width',42],['len','Gown length',145],['sl','Sleeve length',60],['flare','Sleeve flare',1.8],['skirt','Hem flare (cm per side)',30]],sa:1.5,
    make(m){return tunicDraft(m,m.flare,11,['Sew the shoulders, then attach the neck binding.','Sew the sleeves into the armholes.','Sew each underarm and side seam in one line.','Let the gown hang for a day, as the angled seams stretch, then level and hem the bottom and sleeves.','Wear it with the sash for shape.'],m.skirt)}},
  capelet:{label:'Hooded capelet',f:[['neck','Neck',44],['len','Capelet length',40],['hood','Hood height',38]],sa:1.5,
    make(m){const r=(m.neck+3)/Math.PI,o=r+m.len,d=(m.neck+3)/2,h=m.hood;
      const quarter=[...arc(0,0,r,0,Math.PI/2),...arc(0,0,o,Math.PI/2,0)];
      const hood=[[0,0],[d*.62,0],...bez([d*.62,0],[d*.95,0],[d,h*.25],[d,h*.55],16).slice(1),[d,h],[0,h]];
      return {pieces:[{name:'Capelet',cut:'Cut 1 on the fold',fold:true,poly:quarter,grain:1},{name:'Hood',cut:'Cut 2',poly:hood,grain:1}],
      steps:['Sew the hood pieces along the curved back and top.','Sew the hood to the neck edge, matching its seam to the centre back fold.','Hem the hood front and capelet edges.','Add a clasp or ties at the front neck.']}}},
  cowl:{label:'Elven cowl hood',f:[['face','Face opening',62],['drop','Shoulder drop',24],['hood','Hood height',38]],sa:1.5,
    make(m){const w=m.face/2+4,h=m.hood,c=m.drop,poly=[[0,0],[w*.62,0],...bez([w*.62,0],[w*.95,0],[w,h*.25],[w,h*.55],16).slice(1),[w,h],[w+c*.55,h+c],[0,h+c]];
      return {pieces:[{name:'Cowl',cut:'Cut 4: 2 outer, 2 lining',n:4,poly,grain:1}],
      steps:['Sew two pieces along the curved back and down the front neck. Repeat for the lining.','Put the outer and lining right sides together, and sew around the face and the lower edge, leaving a 10 cm gap.','Turn through the gap and stitch it closed.','It pulls on over the head, so check that the face opening fits over your head on the test version.']}}},
  tabard:{label:'Tabard',f:[['tw','Width',44],['len','Length, shoulder to hem',90],['nk','Neck opening',24]],sa:1.5,
    make(m){const w=m.tw/2,n=m.nk/2;const neck=arc(0,0,n,Math.PI/2,0,18);
      const point=[w,m.len*.9],poly=[...neck,[w,0],point,[0,m.len]];
      return {pieces:[{name:'Front',cut:'Cut 1 on the fold',fold:true,poly,grain:1},{name:'Back',cut:'Cut 1 on the fold',fold:true,poly,grain:1}],
      steps:['Sew the front and back at the shoulders.','Hem the neck with a bias strip or a narrow turned edge.','Hem the sides and pointed bottom.','Wear it belted, over a tunic.']}}},
  bracer:{label:'Laced bracers',f:[['wrist','Wrist',17],['arm','Forearm',27],['blen','Bracer length',20]],sa:1,
    make(m){const b=(m.wrist+1)/2,t=(m.arm+1)/2,L=m.blen,poly=[[0,0],[t,0],[b,L],[0,L]];
      return {pieces:[{name:'Bracer',cut:'Cut 4: 2 outer, 2 lining',n:4,fold:true,poly,grain:1}],
      steps:['Sew each outer to its lining, right sides together, leaving a gap at one short end.','Turn, press, and stitch the gap closed.','Add a row of 4 to 6 eyelets or sewn loops down each long edge.','Lace them closed around your arm with cord.']}}},
  sash:{label:'Long sash',f:[['slen','Sash length',220],['swide','Sash width',16]],sa:1,
    make(m){const half=m.slen/2;return {pieces:[{name:'Sash half',cut:'Cut 2',poly:[[0,0],[m.swide*2,0],[m.swide*2,half],[m.swide,half+m.swide*.8],[0,half]],grain:1}],
      steps:['Sew the two halves together at the straight ends.','Fold lengthwise, right sides together, and sew the long edge and the pointed ends, leaving a 10 cm gap.','Turn through the gap, press, and stitch the gap closed.']}}},
  cloak:{label:'Hooded cloak',f:[['neck','Neck',44],['len','Cloak length',120],['hood','Hood height',38]],sa:1.5,
    make(m){const r=(m.neck+3)/Math.PI,o=r+m.len,d=(m.neck+3)/2,h=m.hood;
      const quarter=[...arc(0,0,r,0,Math.PI/2),...arc(0,0,o,Math.PI/2,0)];
      const hood=[[0,0],[d*.62,0],...bez([d*.62,0],[d*.95,0],[d,h*.25],[d,h*.55],16).slice(1),[d,h],[0,h]];
      return {pieces:[{name:'Cloak quarter',cut:'Cut 2',poly:quarter,grain:1},{name:'Hood',cut:'Cut 2',poly:hood,grain:1},{name:'Neck tie',cut:'Cut 2',poly:[[0,0],[6,0],[6,45],[0,45]],grain:1}],
      steps:['The cloak quarter is too big to print sensibly. Instead, chalk it straight onto the fabric: from one corner, draw arcs at '+fmt(r-1.5,1)+' cm and '+fmt(o+1.5,1)+' cm. Print only the hood.','Sew the two cloak quarters together along one straight edge. This is the centre back.','Sew the hood pieces along the curved back and top.','Sew the neck ties, turn them, and pin them to the front neck edge.','Sew the hood to the neck edge, matching the hood seam to the centre back.','Hem the hood front and both front edges, then let the cloak hang for a day before hemming the bottom.']}}},
  apron:{label:'Apron',f:[['bib','Bib width',28],['wide','Skirt width',70],['chest','Bib height',28],['len','Total length',85]],sa:1.5,
    make(m){const b=m.bib/2,w=m.wide/2,poly=[[0,0],[b,0],...bez([b,0],[b,m.chest*.7],[w*.8,m.chest*.8],[w,m.chest+4],18).slice(1),[w,m.len],[0,m.len]];
      return {pieces:[{name:'Apron',cut:'Cut 1 on the fold',fold:true,poly,grain:1},{name:'Neck strap',cut:'Cut 1',poly:[[0,0],[6,0],[6,62],[0,62]],grain:1},{name:'Waist tie',cut:'Cut 2',poly:[[0,0],[7,0],[7,80],[0,80]],grain:1}],
      steps:['Fold each strap and tie lengthwise, sew, and turn.','Hem the curved sides.','Hem the bottom and outer sides.','Hem the top, catching the neck strap at each corner.','Stitch a waist tie to each side, where the curve ends.']}}},
  cushion:{label:'Cushion cover',f:[['size','Cushion size',45]],sa:1.5,
    make(m){const c=m.size-2,back=Math.round(c*.68);return {pieces:[{name:'Front',cut:'Cut 1',poly:[[0,0],[c,0],[c,c],[0,c]],grain:1},{name:'Back panel',cut:'Cut 2',poly:[[0,0],[c,0],[c,back],[0,back]],grain:1}],
      steps:['Hem one long edge of each back panel.','Lay the front right side up, then the back panels right side down, with their hems overlapping in the middle.','Sew all around the outside.','Clip the corners and turn it through the opening. The cover is cut 2 cm under size so the cushion fills it.']}}},
  zip:{label:'Zip pouch',f:[['pw','Pouch width',22],['ph','Pouch height',14]],sa:1,
    make(m){return {pieces:[{name:'Outer',cut:'Cut 2',poly:[[0,0],[m.pw,0],[m.pw,m.ph],[0,m.ph]],grain:1},{name:'Lining',cut:'Cut 2',poly:[[0,0],[m.pw,0],[m.pw,m.ph],[0,m.ph]],grain:1}],
      steps:['Use a zip at least '+fmt(m.pw+2,0)+' cm long.','Sew the zip between one outer and one lining piece, right sides facing the zip. Repeat on the other side.','Open the zip halfway. This matters, or you can\u2019t turn the pouch.','Sew around the outers and the linings, leaving a 7 cm gap in the lining.','Turn through the gap, then stitch the gap closed.']}}},
  drawstring:{label:'Drawstring pouch',f:[['pw','Pouch width',18],['ph','Pouch height',22]],sa:1,
    make(m){return {pieces:[{name:'Pouch',cut:'Cut 2',poly:[[0,0],[m.pw,0],[m.pw,m.ph+5],[0,m.ph+5]],grain:1}],
      steps:['Sew the sides and bottom, stopping 5 cm below the top on each side.','Press those open side edges under and stitch them flat.','Fold the top over by 2.5 cm to make a channel, and stitch it.','Thread a cord through both channels, and knot the ends.']}}}
};
function tunicDraft(m,flare,frontDepth,steps,skirt=0){
  const B=(m.bust+14)/4,neck=8.5,drop=3,ad=m.bust*.22+1,S=m.sh/2;
  const piece=(depth)=>{
    const nc=bez([0,depth],[neck*.6,depth],[neck,depth*.5],[neck,0],16);
    const ah=bez([S,drop],[S-1.5,ad*.5],[S-.5,ad*.9],[B,ad],24);
    return {poly:[...nc,...ah,[B+skirt,m.len],[0,m.len]],nc,ah};
  };
  const f=piece(frontDepth),b=piece(2.5),a=lenOf(f.ah),cap=8,hw=Math.sqrt(Math.max(1,a*a-cap*cap));
  const head=bez([hw,cap],[hw*.6,cap],[hw*.45,0],[0,0],24).reverse();
  const slv=[...head,[hw*Math.max(.86,flare),cap+m.sl],[0,cap+m.sl]];
  const nl=2*(lenOf(f.nc)+lenOf(b.nc));
  return {pieces:[
    {name:'Front',cut:'Cut 1 on the fold',fold:true,poly:f.poly,grain:1},{name:'Back',cut:'Cut 1 on the fold',fold:true,poly:b.poly,grain:1},
    {name:'Sleeve',cut:'Cut 2 on the fold',fold:true,poly:slv,grain:1},{name:'Neck binding',cut:'Cut 1, across the stretch',poly:[[0,0],[nl*.92,0],[nl*.92,5],[0,5]],grain:1}],steps};
}
let tab='pattern',gar='tote',M={},fab=140,saOn=true,db=null,userId=null,dl=null,draft=null;
/* True body measurements are shared across garments; everything else belongs to one garment. */
const BODY=['bust','waist','hip','sh','neck'];
const mk=k=>BODY.includes(k)?k:gar+'.'+k;
function loadBody(){try{M=JSON.parse(localStorage.getItem('sewing-m'))||{}}catch{}}
let saveT;function saveBody(){try{localStorage.setItem('sewing-m',JSON.stringify(M))}catch{}
  clearTimeout(saveT);saveT=setTimeout(()=>{if(db&&userId)db.collection('data/users/'+userId).doc('measurements').set(M).catch(()=>{})},600)}
function buildDraft(){
  const g=GARMENTS[gar],m={};for(const [k,,d] of g.f)m[k]=nf(M[mk(k)],d);
  if(g.f.some(([k])=>!(m[k]>0)))return null;
  const r=g.make(m);
  r.pieces.forEach(p=>{p.outer=grow(p.poly,g.sa,p.fold)});
  /* lay the pieces out for the sheet */
  let x=2,y=2,rowH=0;const maxW=56;
  for(const p of r.pieces){
    const xs=p.outer.map(q=>q[0]),ys=p.outer.map(q=>q[1]),w=Math.max(...xs)-Math.min(...xs),h=Math.max(...ys)-Math.min(...ys);
    if(x+w>maxW&&x>2){x=2;y+=rowH+4;rowH=0}
    p.ox=x-Math.min(...xs);p.oy=y-Math.min(...ys);p.w=w;p.h=h;x+=w+4;rowH=Math.max(rowH,h);
  }
  r.W=Math.max(...r.pieces.map(p=>p.ox+Math.max(...p.outer.map(q=>q[0]))))+2;
  r.H=Math.max(...r.pieces.map(p=>p.oy+Math.max(...p.outer.map(q=>q[1]))))+2;
  r.fabric=fabricNeed(r.pieces,fab);r.sa=g.sa;
  return r;
}
function fabricNeed(pieces,width){
  const items=[];
  for(const p of pieces){const n=p.n||parseInt(p.cut.match(/\d/))||1,wide=p.fold?p.w*2:p.w;for(let i=0;i<n;i++)items.push([wide,p.h])}
  if(items.some(i=>i[0]>width&&i[1]>width))return null;
  items.sort((a,b)=>b[1]-a[1]);
  let used=0,x=0,row=0;
  for(const it of items){const [w,h]=it[0]<=width?it:[it[1],it[0]];if(x+w>width){used+=row;x=0;row=0}x+=w;row=Math.max(row,h)}
  return (used+row)*1.1/100;
}

function drawPattern(){

      const tx=(p.ox+p.w*.22+(p.fold?1:0))*10+ox,ty=(p.oy+Math.min(p.h*.45,18))*10+oy;
      doc.setFontSize(13);doc.text(p.name,tx,ty);doc.setFontSize(10);doc.text(p.cut,tx,ty+5);
      if(p.fold){doc.setLineDashPattern([],0);doc.setLineWidth(.8);doc.setDrawColor(190,50,40);const ys=p.outer.map(q=>q[1]);doc.line(p.ox*10+ox+.4,(Math.min(...ys)+p.oy)*10+oy,p.ox*10+ox+.4,(Math.max(...ys)+p.oy)*10+oy);doc.setDrawColor(0,0,0)}

  }

}
